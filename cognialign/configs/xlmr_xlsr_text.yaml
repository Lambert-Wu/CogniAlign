# ── XLM-R + XLS-R 模态消融：text-only（xlmr）─────────────────────────────
#
# 跨语言：train(英) / test(中) 共用 xlmr 多语言文本特征 feat_xlmr_xlsr/，
# 两边同一编码器 —— 真正的零样本跨语言文本迁移。
#
# 结果目录 = logs/xlmr_pause/

dataset:
  max_length: 512
  pauses: true
  features_dir: 'xlmr_xlsr'
  text_fallback: 'xlmr'

encoders:
  text:
    xlmr:
      suffix: 'xlmr'
      repo: 'FacebookAI/xlm-roberta-base'
      dim: 768
      tokenizer: 'AutoTokenizer'
      model: 'AutoModel'
      word_start_prefix: '▁'
  audio:
    xlsr:
      suffix: 'xlsr'
      repo: 'facebook/wav2vec2-xls-r-300m'
      dim: 1024
      fps: 50
      processor: 'Wav2Vec2FeatureExtractor'
      model: 'Wav2Vec2Model'

train:
  batch_size: 32
  num_epochs: 200
  learning_rate: 0.00002
  weight_decay: 0.01
  early_stopping: True
  early_stopping_patience: 20
  early_stopping_metric: 'loss'
  early_stopping_min_delta: 0.0
  cross_validation: True
  cross_validation_folds: 5

model:
  pooling: 'mean'
  n_layers: 1
  dropout: 0.3
  hidden_size: 768
  intermediate_size: 3072
  n_heads: 12
  num_classes: 1
  hidden_mlp_size: 256
  textual_model: 'xlmr'
  audio_model: ''
  fusion: 'cross'
  architecture: 'plain_transformer'
  gated: false

model_name: ''
