# ── 按论文复现：DistilBERT + Wav2Vec2 + 门控交叉注意力，序列长度 200 ──────
#
# 这份配置 = configs/legacy_distil_wav2vec2_gated.yaml 的「论文设置」版：
#   · 文本 / 音频编码器沿用论文的 frozen DistilBERT + Wav2Vec2-base
#   · model.gated: true —— 论文 CogniAlign 的核心门控交叉注意力（不关掉）
#   · dataset.max_length: 200 —— 论文原始设置（原代码就是 200，
#     后来为了少截样本提到了 512；见 preprocess/extract_features.py 的注释）
#
# 和 legacy 配置的**关键区别（为什么必须单独一份）**：
#   1) max_length 200 ≠ 512：特征 .pt 在磁盘上的形状会变，**必须重跑特征提取**，
#      不能复用 <split>/feat_distil/ 里那批 512 的特征（dataset.py 会直接报错）。
#   2) 特征放到**另一个目录** feat_distil_paper/（dataset.features_dir），
#      不会覆盖已有实验的 feat_distil/。
#   3) model.run_tag: 'paper' —— 结果目录带 _paper 后缀。否则会和
#      legacy_distil_wav2vec2_gated.yaml（同为 distil+wav2vec2+pause+gated）
#      算成**同一个目录** distil_wav2vec2_pause_gated，互相覆盖。
#
# 跑法（提取和训练必须用**同一份**配置）：
#     bash run_preprocess.sh -s all -f configs/paper_distil_wav2vec2_200.yaml
#     bash run_train.sh              -f configs/paper_distil_wav2vec2_200.yaml
#
# 产出：
#     特征  <split>/feat_distil_paper/<dx>/<uid>distil_pauses[_audio].pt   (长度 200)
#     权重  cognialign/logs/distil_wav2vec2_pause_gated_paper/model_fold_<n>.pth

# ── 数据集参数 ──────────────────────────────────────────────────────────
dataset:
  # 论文原始序列长度。改它必须重跑特征提取（磁盘形状会变）。
  max_length: 200
  pauses: true          # 论文带停顿标记那版转写（文件名多一段 _pauses）
  # 特征放 <split>/feat_distil_paper/，和 512 的老特征 feat_distil/ 分开。
  features_dir: 'distil_paper'
  # 只用音频、不用文本时文件名里仍带一段文本后缀（老命名规则遗留，用不到）。
  text_fallback: 'distil'
  # 生僻字 -> 同音常用字：本配置不重复维护，自动回落到 configs/default.yaml
  # 的 dataset.rare_char_map（见 core/feature_spec.py: rare_char_map）。

# ── 编码器登记表（与 legacy 配置一致；加模型只改这里，不动 .py）──────────
encoders:
  text:
    bert:
      suffix: ''
      repo: 'bert-base-uncased'
      dim: 768
      tokenizer: 'BertTokenizer'
      model: 'BertModel'
    distil:
      suffix: 'distil'
      repo: 'distilbert-base-uncased'
      dim: 768
      tokenizer: 'AutoTokenizer'
      model: 'DistilBertModel'
    chinese:
      suffix: 'chinese'
      repo: 'bert-base-chinese'
      dim: 768
      tokenizer: 'BertTokenizer'
      model: 'BertModel'
    roberta:
      suffix: 'roberta'
      repo: 'roberta-base'
      dim: 768
      tokenizer: 'AutoTokenizer'
      model: 'RobertaModel'
      word_start_prefix: 'Ġ'
    stella:
      suffix: 'stella'
      repo: 'NovaSearch/stella_en_1.5B_v5'
      dim: 768
      tokenizer: 'AutoTokenizer'
      model: 'AutoModel'
      trust_remote_code: true
    mistral:
      suffix: 'mistral'
      repo: 'mistralai/Mistral-7B-v0.1'
      dim: 768
      tokenizer: 'AutoTokenizer'
      model: 'AutoModel'
      pad_token_from_eos: true
    qwen:
      suffix: 'qwen'
      repo: 'Qwen/Qwen2.5-7B'
      dim: 768
      tokenizer: 'AutoTokenizer'
      model: 'AutoModel'
    xlmr:
      suffix: 'xlmr'
      repo: 'FacebookAI/xlm-roberta-base'
      dim: 768
      tokenizer: 'AutoTokenizer'
      model: 'AutoModel'
      word_start_prefix: '▁'
  audio:
    wav2vec2:
      suffix: 'audio'
      repo: 'facebook/wav2vec2-base-960h'
      dim: 768
      fps: 50
      processor: 'Wav2Vec2Processor'
      model: 'Wav2Vec2Model'
    xlsr:
      suffix: 'xlsr'
      repo: 'facebook/wav2vec2-xls-r-300m'
      dim: 1024
      fps: 50
      processor: 'Wav2Vec2FeatureExtractor'
      model: 'Wav2Vec2Model'
    egemaps:
      suffix: 'egemaps'
      dim: 88
      fps: 10
      loader: 'opensmile'
      opensmile_feature_set: 'eGeMAPSv02'
      opensmile_feature_level: 'Functionals'
    mel:
      suffix: 'mel'
      dim: 80
      fps: 50
      loader: 'mel_librosa'

train:
  # 训练时取前多少个位置。写 200 = 和 max_length 一致，即不截取。
  seq_length: 200
  batch_size: 32
  num_epochs: 200
  learning_rate: 0.00002
  weight_decay: 0.01
  early_stopping: True
  early_stopping_patience: 20
  # 沿用旧配置的选点规则（验证准确率），和 legacy 那批数字同口径。
  # ⚠️ 选点规则会显著改变结果（见 docs/RESULTS.md 文末），跨实验比较必须统一。
  early_stopping_metric: 'accuracy'
  early_stopping_min_delta: 0.0
  cross_validation: True
  cross_validation_folds: 5

model:
  pooling: 'mean'
  n_layers: 1
  dropout: 0.3
  hidden_size: 768
  intermediate_size: 3072
  n_heads: 12
  num_classes: 1
  hidden_mlp_size: 256
  # 论文的两个冻结编码器
  textual_model: 'distil'
  audio_model: 'wav2vec2'
  # test 是中文语料，文本侧换 bert-base-chinese（train 仍旧 distil）
  split_textual_model:
    test: 'chinese'
  fusion: 'cross'
  architecture: 'cross_attention'
  # ★ 论文核心：门控交叉注意力（H = G⊙H_att + (1−G)⊙A）
  gated: true
  # 结果目录标签：和 legacy_..._gated（512 特征）区分开，避免互相覆盖。
  run_tag: 'paper'

model_name: ''
