# ── 消融：多模态 GCA（Gated Cross-Attention Fusion），distil+wav2vec2 ─────
#
# 目的：模态消融矩阵里的多模态那一格。音频作 query、文本作 key/value，
# 交叉注意力带逐维 Sigmoid 门控（model.gated: true → GatedCrossAttentionFusion）。
# 训练用英文 train，评估：
#   · 英文 val：--textual-model distil
#   · 中文 test：--textual-model chinese（跨语言；音频/文本特征都换成 chinese_*）
#
# 结果目录 = logs/distil_wav2vec2_pause_gated_abl/
#   （gated=true 自动追加 _gated；再加 run_tag=abl，避免覆盖早期的
#    logs/distil_wav2vec2_pause_gated/ —— 那一版是 accuracy 选点，不是本矩阵口径）

dataset:
  max_length: 512
  pauses: true
  features_dir: 'distil'
  text_fallback: 'distil'

encoders:
  text:
    distil:
      suffix: 'distil'
      repo: 'distilbert-base-uncased'
      dim: 768
      tokenizer: 'AutoTokenizer'
      model: 'DistilBertModel'
    chinese:
      suffix: 'chinese'
      repo: 'bert-base-chinese'
      dim: 768
      tokenizer: 'BertTokenizer'
      model: 'BertModel'
  audio:
    wav2vec2:
      suffix: 'audio'
      repo: 'facebook/wav2vec2-base-960h'
      dim: 768
      fps: 50
      processor: 'Wav2Vec2Processor'
      model: 'Wav2Vec2Model'

train:
  batch_size: 32
  num_epochs: 200
  learning_rate: 0.00002
  weight_decay: 0.01
  early_stopping: True
  early_stopping_patience: 20
  early_stopping_metric: 'loss'
  early_stopping_min_delta: 0.0
  cross_validation: True
  cross_validation_folds: 5

model:
  pooling: 'mean'
  n_layers: 1
  dropout: 0.3
  hidden_size: 768
  intermediate_size: 3072
  n_heads: 12
  num_classes: 1
  hidden_mlp_size: 256
  textual_model: 'distil'
  audio_model: 'wav2vec2'
  fusion: 'cross'
  architecture: 'cross_attention'
  gated: true
  # 注意力方向：'audio' = 音频 Q、文本 K/V（A→T，论文在英文上选出的方向，默认值）。
  # 方向消融的另两格见 ablation_gca_ta.yaml / ablation_gca_bca.yaml。
  query_modality: 'audio'
  # 和早期 accuracy 选点的 distil_wav2vec2_pause_gated 分目录，不覆盖它。
  run_tag: 'abl'

model_name: ''
