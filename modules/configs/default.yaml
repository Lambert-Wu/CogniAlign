train:
  batch_size: 32
  num_epochs: 200
  learning_rate: 0.00002
  weight_decay: 0.01
  early_stopping: True
  early_stopping_patience: 20
  cross_validation: True
  cross_validation_folds: 5

model:
  pooling: 'mean' # 'mean', 'cls'
  n_layers: 1
  dropout: 0.3
  hidden_size: 768
  intermediate_size: 3072
  n_heads: 12
  num_classes: 1
  hidden_mlp_size: 256
  textual_model: 'distil'
  audio_model: 'wav2vec2'   # 必须与 preprocessembeddings.py 里的 audio_model 一致，
                            # 否则 dataset.read_CSV 会去找 <uid>distil_wav2vec2.pt 这种
                            # 不存在的文件（音频侧后缀按这里取值拼）
  pauses: False
  fusion: 'cross'

model_name: ''